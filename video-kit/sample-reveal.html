<!doctype html>
<html><head><meta charset="utf-8"><title>Selection reveal</title>
<style>
@font-face { font-family: 'BC'; font-weight: 800; src: url(assets/BarlowCondensed-800.woff2) format('woff2'); }
@font-face { font-family: 'BC'; font-weight: 600; src: url(assets/BarlowCondensed-600.woff2) format('woff2'); }
@font-face { font-family: 'B'; font-weight: 600; src: url(assets/Barlow-600.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Deterministic frame renderer: window.render(t) draws the frame at time t (seconds). 1920x1080.
const W = 1920, H = 1080, cv = document.getElementById("c"), g = cv.getContext("2d");
const TEAMS = [
  { name: "BYU", seed: 8, rec: "22-8", conf: "Big 12", logo: "assets/byu.png", c1: "#0a2a63", c2: "#ffffff", slot: 0 },
  { name: "COLORADO", seed: 9, rec: "19-11", conf: "Big 12", logo: "assets/colorado.png", c1: "#cfb87c", c2: "#000000", slot: 1 },
];
const SCENE = 7.0, TOTAL = 14.0;
const imgs = {};
window.ready = Promise.all([
  document.fonts.load("800 100px BC"), document.fonts.load("600 100px BC"), document.fonts.load("600 40px B"),
  ...TEAMS.map((t) => new Promise((res) => { const i = new Image(); i.onload = () => { imgs[t.name] = i; res(); }; i.src = t.logo; })),
]);

// ---- easing
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };   // overshoot
const seg = (t, a, b) => clamp((t - a) / (b - a));
// seeded noise for shake / sparks
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---- background: arena darkness, light sweeps, floor grid
function background(t, energy) {
  const bg = g.createRadialGradient(W / 2, H * .45, 100, W / 2, H * .45, 1400);
  bg.addColorStop(0, "#102a4a"); bg.addColorStop(.5, "#070f1e"); bg.addColorStop(1, "#02050b");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // floor
  g.save(); g.globalAlpha = .35;
  const floor = g.createLinearGradient(0, H * .62, 0, H);
  floor.addColorStop(0, "rgba(255,180,80,0)"); floor.addColorStop(1, "rgba(255,160,60,.35)");
  g.fillStyle = floor; g.fillRect(0, H * .62, W, H * .38);
  g.strokeStyle = "rgba(140,190,255,.18)"; g.lineWidth = 1.2;
  for (let i = -14; i <= 14; i++) { g.beginPath(); g.moveTo(W / 2 + i * 60, H * .66); g.lineTo(W / 2 + i * 420, H + 40); g.stroke(); }
  for (let k = 0; k < 9; k++) { const y = H * .66 + Math.pow(k / 8, 1.8) * H * .36; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
  // light sweeps
  for (let i = 0; i < 4; i++) {
    const a = Math.sin(t * .9 + i * 1.7) * .55 + (i - 1.5) * .22;
    const x = W * (.2 + i * .2);
    g.save(); g.translate(x, -80); g.rotate(a);
    const lg = g.createLinearGradient(0, 0, 0, 1500);
    lg.addColorStop(0, `rgba(120,200,255,${.16 + energy * .1})`); lg.addColorStop(1, "rgba(120,200,255,0)");
    g.fillStyle = lg; g.beginPath(); g.moveTo(-40, 0); g.lineTo(40, 0); g.lineTo(260, 1500); g.lineTo(-260, 1500); g.closePath(); g.fill();
    g.restore();
  }
  // dust / crowd sparkle
  g.save();
  for (let i = 0; i < 160; i++) {
    const x = rnd(i) * W, y = rnd(i + 999) * H * .6, tw = .3 + .7 * Math.abs(Math.sin(t * 2.2 + i));
    g.fillStyle = `rgba(255,230,180,${.12 * tw})`; g.fillRect(x, y, 2, 2);
  }
  g.restore();
}
function vignette() {
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.78)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function kicker(t, text, sub) {
  const a = seg(t, 0, .5);
  g.save(); g.globalAlpha = a; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "600 34px BC"; g.fillStyle = "rgba(255,214,165,.95)"; g.letterSpacing = "10px";
  g.fillText(text, W / 2, 86 - (1 - a) * 20);
  g.font = "600 24px B"; g.fillStyle = "rgba(255,255,255,.55)"; g.letterSpacing = "4px";
  g.fillText(sub, W / 2, 128 - (1 - a) * 20);
  g.restore();
}
// glass panel
function glass(x, y, w, h, r, { glow = 0, tint = "255,255,255", alpha = .14, stroke = .55 } = {}) {
  g.save();
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (glow > 0) { g.shadowColor = `rgba(255,214,165,${glow})`; g.shadowBlur = 40 * glow; }
  const f = g.createLinearGradient(x, y, x + w, y + h);
  f.addColorStop(0, `rgba(${tint},${alpha + .12})`); f.addColorStop(.45, `rgba(${tint},${alpha * .5})`); f.addColorStop(1, `rgba(${tint},${alpha + .05})`);
  g.fillStyle = f; g.fill();
  g.shadowBlur = 0;
  g.lineWidth = 2; g.strokeStyle = `rgba(255,255,255,${stroke})`; g.stroke();
  // top-edge highlight
  g.beginPath(); g.roundRect(x + 3, y + 3, w - 6, h * .42, r - 2);
  const hl = g.createLinearGradient(0, y, 0, y + h * .45); hl.addColorStop(0, "rgba(255,255,255,.32)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = hl; g.fill();
  g.restore();
}
function drawLogo(img, cx, cy, size, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 24; g.shadowOffsetY = 10;
  g.drawImage(img, cx - size / 2, cy - size / 2, size, size); g.restore();
}

// ---- bracket geometry (one region, 16 teams): first-round slots on the left, then R32, S16, E8
const BR = { x0: 240, y0: 190, slotW: 420, slotH: 46, gap: 8, colGap: 110 };
function slotRect(round, i) {   // round 0: 16 slots, 1: 8, 2: 4, 3: 2
  const pitch = (BR.slotH + BR.gap) * Math.pow(2, round);
  const y = BR.y0 + i * pitch + (pitch - BR.slotH) / 2;
  return { x: BR.x0 + round * (BR.slotW + BR.colGap), y, w: BR.slotW, h: BR.slotH };
}
const SEED_ORDER = [1, 16, 8, 9, 5, 12, 4, 13, 6, 11, 3, 14, 7, 10, 2, 15];
function bracket(t, filled, z = 0) {
  g.save();
  // connectors
  g.strokeStyle = "rgba(180,220,255,.35)"; g.lineWidth = 2;
  for (let r = 0; r < 3; r++) for (let i = 0; i < 16 / Math.pow(2, r); i += 2) {
    const a = slotRect(r, i), b = slotRect(r, i + 1), n = slotRect(r + 1, i / 2);
    const xm = a.x + a.w + BR.colGap / 2;
    g.beginPath(); g.moveTo(a.x + a.w, a.y + a.h / 2); g.lineTo(xm, a.y + a.h / 2); g.lineTo(xm, b.y + b.h / 2); g.lineTo(b.x + b.w, b.y + b.h / 2); g.stroke();
    g.beginPath(); g.moveTo(xm, n.y + n.h / 2); g.lineTo(n.x, n.y + n.h / 2); g.stroke();
  }
  // column labels
  g.font = "600 22px BC"; g.fillStyle = "rgba(255,214,165,.8)"; g.textAlign = "center"; g.letterSpacing = "4px";
  ["FIRST ROUND", "SECOND ROUND", "SWEET 16", "ELITE EIGHT"].forEach((s, r) => { const q = slotRect(r, 0); g.save(); g.globalAlpha = clamp(1 - z * 1.6); g.fillText(s, q.x + q.w / 2, BR.y0 - 28); g.restore(); });
  // slots
  for (let r = 0; r < 4; r++) for (let i = 0; i < 16 / Math.pow(2, r); i++) {
    const q = slotRect(r, i);
    const fillKey = r === 0 ? (i === 2 ? 0 : i === 3 ? 1 : -1) : -1;
    const team = fillKey >= 0 ? filled[fillKey] : null;
    if (team) {
      const { f, glow } = team;
      glass(q.x, q.y, q.w, q.h, 10, { glow: glow * .9, tint: "255,230,190", alpha: .22 + .18 * f, stroke: .9 });
      g.save(); g.globalAlpha = f;
      g.textAlign = "left"; g.textBaseline = "middle"; g.font = "800 30px BC"; g.fillStyle = "#ffd6a5";
      g.fillText(String(team.t.seed), q.x + 16, q.y + q.h / 2 + 1);
      drawLogo(imgs[team.t.name], q.x + 66, q.y + q.h / 2, 38);
      g.font = "800 30px BC"; g.fillStyle = "#fff"; g.letterSpacing = "1px"; g.fillText(team.t.name, q.x + 98, q.y + q.h / 2 + 1);
      g.font = "600 20px B"; g.fillStyle = "rgba(255,255,255,.6)"; g.textAlign = "right"; g.fillText(team.t.rec, q.x + q.w - 14, q.y + q.h / 2 + 1);
      g.restore();
    } else {
      glass(q.x, q.y, q.w, q.h, 10, { alpha: .07, stroke: .3 });
      if (r === 0) {
        g.save(); g.globalAlpha = .55; g.textAlign = "left"; g.textBaseline = "middle"; g.font = "800 26px BC"; g.fillStyle = "rgba(255,214,165,.9)";
        g.fillText(String(SEED_ORDER[i]), q.x + 16, q.y + q.h / 2 + 1);
        g.font = "600 20px B"; g.fillStyle = "rgba(255,255,255,.35)"; g.letterSpacing = "3px"; g.fillText("TBA", q.x + 66, q.y + q.h / 2 + 1); g.restore();
      }
    }
  }
  g.restore();
}

// ---- one team's scene, local time s in [0, SCENE)
function scene(team, s, idx, prevFilled) {
  const slamAt = .9, logoAt = 1.6, zoomAt = 3.6, landAt = 5.1, outAt = 6.55;
  const energy = s < slamAt ? 0 : Math.exp(-(s - slamAt) * 1.8);
  // camera shake on slam
  const shake = s > slamAt && s < slamAt + .5 ? (1 - seg(s, slamAt, slamAt + .5)) * 18 : 0;
  g.save();
  g.translate((rnd(Math.floor(s * 60)) - .5) * shake, (rnd(Math.floor(s * 60) + 7) - .5) * shake);
  background(s + idx * 3, energy);

  // bracket phase: zoom from wide bracket to the 8/9 slots
  const z = easeInOut(seg(s, zoomAt, landAt));
  const inBracket = s >= zoomAt - .3;
  if (inBracket) {
    const fadeIn = seg(s, zoomAt - .3, zoomAt + .3);
    const target = slotRect(0, team.slot === 0 ? 2 : 3), other = slotRect(0, team.slot === 0 ? 3 : 2);
    const fx = (target.x + other.x) / 2 + target.w / 2, fy = (target.y + other.y) / 2 + target.h / 2;   // focus: the 8/9 pair
    const scale = lerp(.78, 2.15, z);
    const cx = lerp(W / 2, fx, z), cy = lerp(H / 2 + 40, fy, z);
    g.save(); g.globalAlpha = fadeIn;
    g.translate(W / 2, H / 2); g.scale(scale, scale); g.translate(-cx, -cy);
    const landF = seg(s, landAt - .15, landAt + .25);
    const filled = [null, null];
    if (prevFilled) filled[prevFilled.slot] = { t: prevFilled, f: 1, glow: .25 };
    filled[team.slot] = { t: team, f: easeOut(landF), glow: landF > 0 ? .5 + .5 * Math.sin((s - landAt) * 6) * Math.exp(-(s - landAt)) : 0 };
    bracket(s, filled, z);
    g.restore();
    // region title in screen space so the zoom never crops it
    g.save(); g.globalAlpha = fadeIn; g.textAlign = "center"; g.textBaseline = "middle"; g.font = "800 46px BC"; g.fillStyle = "rgba(255,255,255,.92)"; g.letterSpacing = "8px";
    g.fillText("MIDWEST REGION", W / 2, 86); g.font = "600 22px B"; g.fillStyle = "rgba(255,214,165,.85)"; g.letterSpacing = "4px"; g.fillText("FIRST ROUND   ·   THE FIELD OF 68", W / 2, 126); g.restore();
    // landing flash ring around the slot
    if (landF > 0 && landF < 1) {
      const r = lerp(60, 520, easeOut(landF)); g.save(); g.globalAlpha = 1 - landF; g.strokeStyle = "rgba(255,214,165,.9)"; g.lineWidth = 6 * (1 - landF);
      g.beginPath(); g.ellipse(W / 2, H / 2, r * 1.6, r * .5, 0, 0, Math.PI * 2); g.stroke(); g.restore();
    }
  }

  // reveal phase: seed slam + logo + name, which flies into the bracket as the zoom begins
  if (s < zoomAt + .6) {
    const away = easeIn(seg(s, zoomAt, zoomAt + .6));            // reveal elements fly up/out as the bracket takes over
    g.save(); g.globalAlpha = 1 - away; g.translate(0, -away * 260);
    kicker(s, idx === 0 ? "SELECTION SUNDAY" : "SELECTION SUNDAY", "MIDWEST REGION  ·  FIRST ROUND");
    // seed number
    if (s >= slamAt) {
      const k = seg(s, slamAt, slamAt + .45), sc = lerp(3.2, 1, back(k));
      g.save(); g.translate(W / 2 - 520, H / 2 + 20); g.scale(sc, sc); g.globalAlpha = clamp(k * 3);
      g.textAlign = "center"; g.textBaseline = "middle"; g.font = "800 520px BC";
      g.lineWidth = 14; g.strokeStyle = "rgba(255,214,165,.9)"; g.strokeText(String(team.seed), 0, 0);
      const nf = g.createLinearGradient(0, -240, 0, 240); nf.addColorStop(0, "#ffffff"); nf.addColorStop(.5, "#dfe8ff"); nf.addColorStop(1, "#9fb3d9");
      g.fillStyle = nf; g.fillText(String(team.seed), 0, 0);
      g.restore();
      g.save(); g.globalAlpha = clamp(k * 2); g.textAlign = "center"; g.font = "600 44px BC"; g.fillStyle = "rgba(255,214,165,.9)"; g.letterSpacing = "12px";
      g.fillText("SEED", W / 2 - 520, H / 2 + 330); g.restore();
    }
    // logo streak + settle
    if (s >= logoAt) {
      const k = seg(s, logoAt, logoAt + .55), img = imgs[team.name];
      const streakX = lerp(W + 500, W / 2 + 120, easeOut(k));
      if (k < 1) { g.save(); g.globalAlpha = (1 - k) * .7; const sg = g.createLinearGradient(streakX, 0, streakX + 900, 0); sg.addColorStop(0, "rgba(255,255,255,.9)"); sg.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = sg; g.fillRect(streakX, H / 2 - 120, 900, 240); g.restore(); }
      const sc = lerp(2.4, 1, back(k)), pulse = 1 + .02 * Math.sin(s * 5);
      g.save(); g.translate(streakX, H / 2 - 40); g.scale(sc * pulse, sc * pulse);
      glass(-230, -230, 460, 460, 48, { glow: .6 * clamp(k * 1.5), alpha: .12, stroke: .8 });
      drawLogo(img, 0, 0, 340, 1); g.restore();
      // name + record
      const n = seg(s, logoAt + .3, logoAt + .8);
      g.save(); g.globalAlpha = n; g.textAlign = "center"; g.textBaseline = "middle";
      g.font = "800 150px BC"; g.letterSpacing = "6px";
      g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,.6)"; g.strokeText(team.name, W / 2 + 120, H / 2 + 300 - (1 - easeOut(n)) * 40);
      g.fillStyle = "#fff"; g.fillText(team.name, W / 2 + 120, H / 2 + 300 - (1 - easeOut(n)) * 40);
      g.font = "600 40px B"; g.fillStyle = "rgba(255,214,165,.95)"; g.letterSpacing = "6px";
      g.fillText(`${team.rec}   ·   ${team.conf.toUpperCase()}   ·   AT-LARGE`, W / 2 + 120, H / 2 + 400 - (1 - easeOut(n)) * 40);
      g.restore();
    }
    g.restore();
    // slam flash + sparks
    if (s >= slamAt) {
      const f = Math.exp(-(s - slamAt) * 9); g.fillStyle = `rgba(255,240,220,${f * .85})`; g.fillRect(0, 0, W, H);
      g.save(); for (let i = 0; i < 90; i++) { const a = rnd(i * 3) * Math.PI * 2, sp = 300 + rnd(i * 3 + 1) * 900, d = (s - slamAt); const x = W / 2 - 520 + Math.cos(a) * sp * d, y = H / 2 + 20 + Math.sin(a) * sp * d + 400 * d * d; g.globalAlpha = clamp(1 - d * 1.4); g.fillStyle = rnd(i) > .5 ? "#ffd6a5" : "#ffffff"; g.fillRect(x, y, 5, 5); } g.restore();
    }
  }
  // final vs lockup on the second team
  if (idx === 1 && s >= landAt + .9) {
    const k = easeOut(seg(s, landAt + .9, landAt + 1.4));
    g.save(); g.globalAlpha = k; g.textAlign = "center"; g.textBaseline = "middle";
    const band = g.createLinearGradient(0, H - 300, 0, H); band.addColorStop(0, "rgba(2,5,11,0)"); band.addColorStop(.45, "rgba(2,5,11,.92)"); band.addColorStop(1, "rgba(2,5,11,.98)");
    g.fillStyle = band; g.fillRect(0, H - 300, W, 300);
    glass(W / 2 - 560, H - 190 + (1 - k) * 60, 1120, 120, 24, { glow: .35, alpha: .18, stroke: .8 });
    g.font = "800 72px BC"; g.fillStyle = "#fff"; g.letterSpacing = "4px";
    g.fillText("8  BYU", W / 2 - 300, H - 130 + (1 - k) * 60);
    g.fillText("9  COLORADO", W / 2 + 300, H - 130 + (1 - k) * 60);
    g.font = "800 54px BC"; g.fillStyle = "#ffd6a5"; g.fillText("VS", W / 2, H - 128 + (1 - k) * 60);
    g.restore();
  }
  // scene wipe out
  const out = seg(s, outAt, SCENE); if (out > 0) { g.fillStyle = `rgba(0,0,0,${easeIn(out)})`; g.fillRect(0, 0, W, H); }
  g.restore();
}

window.render = function (t) {
  g.clearRect(0, 0, W, H);
  const idx = t < SCENE ? 0 : 1, s = t - idx * SCENE;
  scene(TEAMS[idx], s, idx, idx === 1 ? TEAMS[0] : null);
  vignette();
  // letterbox film bars, subtle
  g.fillStyle = "rgba(0,0,0,.9)"; g.fillRect(0, 0, W, 34); g.fillRect(0, H - 34, W, 34);
  // fade-in at the very start
  if (t < .5) { g.fillStyle = `rgba(0,0,0,${1 - t / .5})`; g.fillRect(0, 0, W, H); }
};
</script></body></html>
