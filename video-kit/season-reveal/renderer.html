<!doctype html>
<html><head><meta charset="utf-8"><title>Selection Sunday reveal</title>
<style>
@font-face { font-family: 'BC'; font-weight: 800; src: url(fonts/BarlowCondensed-800.woff2) format('woff2'); }
@font-face { font-family: 'BC'; font-weight: 600; src: url(fonts/BarlowCondensed-600.woff2) format('woff2'); }
@font-face { font-family: 'B'; font-weight: 600; src: url(fonts/Barlow-600.woff2) format('woff2'); }

html, body { margin: 0; background: #000; overflow: hidden; }

</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Deterministic frame renderer for the Selection Sunday reveal. window.render(clipNumber, localSeconds) draws one frame.
// Data comes from <dir>/field.json, outs.json, plan.json (dir = ?d=...). No team is hard-coded here.
const W = 1920, H = 1080, cv = document.getElementById("c"), g = cv.getContext("2d");
const D = new URLSearchParams(location.search).get("d") || "data";
let FIELD, OUTS, PLAN; const imgs = {}, accent = {}, warnings = [];
const SEASON = new URLSearchParams(location.search).get("season") || "3";
window.warnings = warnings;
const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => { warnings.push("missing image " + src); res(null); }; i.src = src; });
window.ready = (async () => {
  [FIELD, OUTS, PLAN] = await Promise.all(["field", "outs", "plan"].map((n) => fetch(`${D}/${n}.json`).then((r) => r.json())));
  FIELD.forEach((t, i) => { t._i = i; });
  await Promise.all([document.fonts.load("800 100px BC"), document.fonts.load("600 100px BC"), document.fonts.load("600 40px B"), document.fonts.load("500 40px B")]);
  const all = [...FIELD, ...OUTS];
  await Promise.all([...all.map(async (t) => { imgs[t.id] = await loadImg(t.logo); if (imgs[t.id]) accent[t.id] = dominant(imgs[t.id]); }), loadImg("assets/brand/hardwood-mark.png").then((i) => { imgs.mark = i; }), loadImg("assets/brand/icon-512.png").then((i) => { imgs.icon = i; })]);
  return true;
})();
function dominant(img) {
  const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d"); x.drawImage(img, 0, 0, 32, 32);
  const d = x.getImageData(0, 0, 32, 32).data; let r = 0, gg = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 140) continue; const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]); const sat = mx ? (mx - mn) / mx : 0; if (sat < .28 || mx < 60) continue; r += d[i] * sat; gg += d[i + 1] * sat; b += d[i + 2] * sat; n += sat; }

}

// ---------- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (x) => 1 - Math.pow(1 - x, 3), easeIn = (x) => x * x * x;
const easeInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const PER = () => PLAN.PER;
function fit(text, weight, family, maxW, size, min) {   // largest size <= size that fits maxW; logs if it had to go below min
  g.save(); g.letterSpacing = "0px"; let s = size;
  for (; s > 8; s -= 2) { g.font = `${weight} ${s}px ${family}`; if (g.measureText(text).width <= maxW) break; }
  g.restore(); if (s < min) warnings.push(`text of length ${text.length} shrunk below ${min} -> ${s}`); return s;
}
function wrap(text, font, maxW) {
  g.save(); g.font = font; g.letterSpacing = "0px"; const out = []; let cur = "";
  for (const w of text.split(/\s+/)) { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); g.restore(); return out;
}
function glass(x, y, w, h, r, { glow = 0, tint = "255,255,255", alpha = .14, stroke = .55, glowRGB = "255,214,165" } = {}) {
  g.save(); g.beginPath(); g.roundRect(x, y, w, h, r);
  if (glow > 0) { g.shadowColor = `rgba(${glowRGB},${glow})`; g.shadowBlur = 40 * glow; }

  f.addColorStop(0, `rgba(${tint},${alpha + .12})`); f.addColorStop(.45, `rgba(${tint},${alpha * .5})`); f.addColorStop(1, `rgba(${tint},${alpha + .05})`);

  const hl = g.createLinearGradient(0, y, 0, y + h * .45); hl.addColorStop(0, "rgba(255,255,255,.32)"); hl.addColorStop(1, "rgba(255,255,255,0)");

}
function drawLogo(img, cx, cy, size, alpha = 1, shadow = true) {
  if (!img) return; const ar = img.naturalWidth / img.naturalHeight, w = ar >= 1 ? size : size * ar, h = ar >= 1 ? size / ar : size;
  g.save(); g.globalAlpha *= alpha; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  if (shadow) { g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = size > 100 ? 24 : 8; g.shadowOffsetY = size > 100 ? 10 : 3; }
  g.drawImage(img, cx - w / 2, cy - h / 2, w, h); g.restore();
}
function text(str, x, y, { font = "800 60px BC", fill = "#fff", align = "center", base = "middle", ls = "0px", stroke = null, sw = 6, alpha = 1 } = {}) {
  g.save(); g.globalAlpha *= alpha; g.font = font; g.textAlign = align; g.textBaseline = base; g.letterSpacing = ls;

}
const MOODS = { bright: { c0: "#102a4a", c1: "#070f1e", c2: "#02050b", beam: "120,200,255", floor: "255,160,60" }, dark: { c0: "#2a1620", c1: "#0d0a12", c2: "#030204", beam: "190,120,130", floor: "170,60,60" } };
function background(t, energy, mood = "bright") {
  const M = MOODS[mood];
  const bg = g.createRadialGradient(W / 2, H * .45, 100, W / 2, H * .45, 1400);
  bg.addColorStop(0, M.c0); bg.addColorStop(.5, M.c1); bg.addColorStop(1, M.c2); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = .35; const floor = g.createLinearGradient(0, H * .62, 0, H);
  floor.addColorStop(0, `rgba(${M.floor},0)`); floor.addColorStop(1, `rgba(${M.floor},.35)`); g.fillStyle = floor; g.fillRect(0, H * .62, W, H * .38);
  g.strokeStyle = mood === "dark" ? "rgba(210,150,160,.14)" : "rgba(140,190,255,.18)"; g.lineWidth = 1.2;
  for (let i = -14; i <= 14; i++) { g.beginPath(); g.moveTo(W / 2 + i * 60, H * .66); g.lineTo(W / 2 + i * 420, H + 40); g.stroke(); }
  for (let k = 0; k < 9; k++) { const y = H * .66 + Math.pow(k / 8, 1.8) * H * .36; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
  for (let i = 0; i < 4; i++) {
    const a = Math.sin(t * .9 + i * 1.7) * .55 + (i - 1.5) * .22, x = W * (.2 + i * .2);
    g.save(); g.translate(x, -80); g.rotate(a); const lg = g.createLinearGradient(0, 0, 0, 1500);
    lg.addColorStop(0, `rgba(${M.beam},${.16 + energy * .1})`); lg.addColorStop(1, `rgba(${M.beam},0)`); g.fillStyle = lg;
    g.beginPath(); g.moveTo(-40, 0); g.lineTo(40, 0); g.lineTo(260, 1500); g.lineTo(-260, 1500); g.closePath(); g.fill(); g.restore();
  }
  g.save(); for (let i = 0; i < 160; i++) { const x = rnd(i) * W, y = rnd(i + 999) * H * .6, tw = .3 + .7 * Math.abs(Math.sin(t * 2.2 + i)); g.fillStyle = `rgba(255,230,180,${.12 * tw})`; g.fillRect(x, y, 2, 2); } g.restore();
}
function finish(s, dur, flash = 0) {   // vignette, letterbox, boundary fades
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.78)");
  g.fillStyle = v; g.fillRect(0, 0, W, H); g.fillStyle = "rgba(0,0,0,.9)"; g.fillRect(0, 0, W, 34); g.fillRect(0, H - 34, W, 34);
  if (s < .14) { g.fillStyle = `rgba(0,0,0,${1 - s / .14})`; g.fillRect(0, 0, W, H); }
  if (s > dur - .14) { g.fillStyle = `rgba(0,0,0,${(s - (dur - .14)) / .14})`; g.fillRect(0, 0, W, H); }
}
function flash(s, at, k = 9, a = .85, rgb = "255,240,220") { if (s < at) return; const f = Math.exp(-(s - at) * k); if (f > .01) { g.fillStyle = `rgba(${rgb},${f * a})`; g.fillRect(0, 0, W, H); } }
function sparks(s, at, cx, cy, n = 90, rgb = "255,214,165") {
  if (s < at) return; const d = s - at; if (d > 1.4) return; g.save();
  for (let i = 0; i < n; i++) { const a = rnd(i * 3 + at * 7) * Math.PI * 2, sp = 300 + rnd(i * 3 + 1) * 900; const x = cx + Math.cos(a) * sp * d, y = cy + Math.sin(a) * sp * d + 300 * d * d; g.globalAlpha = Math.max(0, 1 - d / 1.2) * .9; g.fillStyle = `rgba(${rgb},1)`; g.fillRect(x, y, 4 + rnd(i) * 4, 4 + rnd(i) * 4); }

}
function flare(cx, cy, k) {   // additive lens streak, k in 0..1

  const hz = g.createLinearGradient(cx - 700, 0, cx + 700, 0); hz.addColorStop(0, "rgba(255,200,120,0)"); hz.addColorStop(.5, "rgba(255,230,190,.9)"); hz.addColorStop(1, "rgba(255,200,120,0)");
  g.fillStyle = hz; g.fillRect(cx - 700, cy - 3, 1400, 6);
  const rg = g.createRadialGradient(cx, cy, 0, cx, cy, 260); rg.addColorStop(0, "rgba(255,240,210,.8)"); rg.addColorStop(1, "rgba(255,200,120,0)"); g.fillStyle = rg; g.fillRect(cx - 260, cy - 260, 520, 520);

function kicker(a, t1, t2, y = 86) {

  if (t2) text(t2, W / 2, y + 42 - (1 - a) * 20, { font: "600 24px B", fill: "rgba(255,255,255,.55)", ls: "4px" }); g.restore();
}

// ---------- bracket geometry (one region)

const SEED_ORDER = [1, 16, 8, 9, 5, 12, 4, 13, 6, 11, 3, 14, 7, 10, 2, 15];
function slotRect(round, i) { const pitch = (BR.slotH + BR.gap) * Math.pow(2, round); return { x: BR.x0 + round * (BR.slotW + BR.colGap), y: BR.y0 + i * pitch + (pitch - BR.slotH) / 2, w: BR.slotW, h: BR.slotH }; }
function slotFilled(q, items, labelAlpha = 1) {

  glass(q.x, q.y, q.w, q.h, 10, { glow: glow * .9, tint: "255,230,190", alpha: .22 + .18 * f, stroke: .9 });
  g.save(); g.globalAlpha = f; text(String(seed), q.x + 16, q.y + q.h / 2 + 1, { font: "800 30px BC", fill: "#ffd6a5", align: "left" });

}
function bracket(filled, z = 0) {   // filled: Map slotIndex -> [{t,f,glow}]

function regionFilled(region, uptoIdx, cur = null) {   // teams of this region revealed before FIELD[uptoIdx], plus optional current entry

const REG_NAME = (r) => r.toUpperCase() + " REGION";

// ---------- scenes
function teamScene(c, s) {

      g.globalAlpha = n * (1 - k); text(`${t.rec}   ·   ${t.conf.toUpperCase()}   ·   ${isAuto ? "AUTOMATIC BID" : "AT-LARGE"}`, W / 2 + 120, H / 2 + 400 - (1 - easeOut(n)) * 40, { font: "600 40px B", fill: "rgba(255,214,165,.95)", ls: "6px" }); g.restore();
    }

      const k2 = easeOut(seg(s, c0, c1)), px = lerp(1000, 860, k2), py = 250, pw = 940, ph = 620;
      g.save(); g.globalAlpha = k2; glass(px, py, pw, ph, 30, { glow: .2, alpha: .12, stroke: .7, glowRGB: acc });
      g.beginPath(); g.roundRect(px + 6, py + 6, 8, ph - 12, 4); g.fillStyle = `rgba(${acc},.9)`; g.fill();
      text(`${t.rec}   ·   ${t.conf.toUpperCase()}`, px + 40, py + 140, { font: "600 34px B", fill: "rgba(255,214,165,.95)", align: "left", ls: "4px" });
      const chip = (label, x, tint) => { g.font = "600 24px BC"; g.letterSpacing = "4px"; const w = g.measureText(label).width + 36; glass(x, py + 176, w, 44, 22, { alpha: .18, stroke: .6, tint }); text(label, x + 18, py + 199, { font: "600 24px BC", ls: "4px", align: "left" }); return w + 14; };
